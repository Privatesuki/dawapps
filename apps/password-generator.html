<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>Password &amp; Hash · DAWAPPS</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/global.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/i18n.js"></script>
</head>
<body>
<main class="app">
  <h1>Password &amp; Hash Generator</h1>
  <p>Built with your browser’s cryptographic random source. Nothing is sent anywhere.</p>

  <label for="pass">Password</label>
  <div class="row" style="margin-top:0">
    <input id="pass" class="mono" readonly aria-live="polite" style="flex:4;min-width:200px">
    <button type="button" id="copy" class="secondary">Copy</button>
    <button type="button" id="generate">New</button>
  </div>
  <div class="meter" aria-hidden="true"><i id="bar"></i></div>
  <p class="small" id="strength" style="margin-top:6px"></p>

  <label for="len">Length: <b id="lenv">20</b></label>
  <input type="range" id="len" min="8" max="64" value="20">

  <div class="grid2">
    <label class="check"><input type="checkbox" id="upper" checked> Uppercase A–Z</label>
    <label class="check"><input type="checkbox" id="lower" checked> Lowercase a–z</label>
    <label class="check"><input type="checkbox" id="digits" checked> Numbers 0–9</label>
    <label class="check"><input type="checkbox" id="symbols" checked> Symbols !@#$</label>
  </div>
  <label class="check"><input type="checkbox" id="ambig" checked> Avoid look-alike characters (0 O 1 l I)</label>

  <hr>
  <h2>Hash generator</h2>
  <div class="grid2">
    <div>
      <label for="algo">Algorithm</label>
      <select id="algo">
        <option>SHA-256</option><option>SHA-512</option><option>SHA-384</option><option>SHA-1</option>
      </select>
    </div>
    <div>
      <label for="hashInput">Text to hash</label>
      <input id="hashInput" placeholder="Type or paste text" autocomplete="off">
    </div>
  </div>
  <div class="kv"><b>Digest</b><code id="digest">—</code><button type="button" class="secondary small" id="copyHash">Copy</button></div>
</main>

<script src="../assets/js/common.js"></script>
<script>
(() => {
  const $ = DAW.$;
  const SETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    digits: '0123456789',
    symbols: '!@#$%^&*()-_=+[]{};:,.?'
  };
  const AMBIGUOUS = /[0O1lI|]/g;

  // Unbiased random integer in [0, n) — rejection sampling avoids modulo bias.
  function rnd(n) {
    const limit = Math.floor(2 ** 32 / n) * n;
    const buf = new Uint32Array(1);
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }

  function generate() {
    const sets = Object.keys(SETS).filter(k => $(k).checked)
      .map(k => $('ambig').checked ? SETS[k].replace(AMBIGUOUS, '') : SETS[k]);
    if (!sets.length) { $('pass').value = ''; $('strength').textContent = 'Select at least one character type.'; $('bar').style.width = '0'; return; }

    const len = Math.max(+$('len').value, sets.length);
    const pool = sets.join('');
    const out = sets.map(s => s[rnd(s.length)]);                 // one from every chosen set
    while (out.length < len) out.push(pool[rnd(pool.length)]);
    for (let i = out.length - 1; i > 0; i--) { const j = rnd(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
    $('pass').value = out.join('');

    const bits = Math.round(len * Math.log2(new Set(pool).size));
    const label = bits < 40 ? 'Weak' : bits < 60 ? 'Fair' : bits < 80 ? 'Strong' : 'Excellent';
    $('strength').textContent = `${label} · about ${bits} bits of entropy`;
    const bar = $('bar');
    bar.style.width = Math.min(100, bits / 128 * 100) + '%';
    bar.style.background = bits < 40 ? 'var(--danger)' : bits < 60 ? '#e0a100' : 'var(--success)';
  }

  async function hash() {
    const text = $('hashInput').value;
    if (!text) { $('digest').textContent = '—'; return; }
    if (!(window.crypto && crypto.subtle)) { $('digest').textContent = 'Hashing needs HTTPS or localhost.'; return; }
    const buf = await crypto.subtle.digest($('algo').value, new TextEncoder().encode(text));
    $('digest').textContent = Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  }

  $('len').addEventListener('input', () => { $('lenv').textContent = $('len').value; generate(); });
  ['upper', 'lower', 'digits', 'symbols', 'ambig'].forEach(id => $(id).addEventListener('change', generate));
  $('generate').addEventListener('click', generate);
  $('copy').addEventListener('click', e => { if ($('pass').value) DAW.copy($('pass').value, e.currentTarget); });
  $('hashInput').addEventListener('input', hash);
  $('algo').addEventListener('change', hash);
  $('copyHash').addEventListener('click', e => { const d = $('digest').textContent; if (d && d !== '—') DAW.copy(d, e.currentTarget); });
  generate();
})();
</script>
</body>
</html>
