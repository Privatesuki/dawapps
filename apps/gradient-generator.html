<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>Gradient Generator · DAWAPPS</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/global.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/i18n.js"></script>
<style>
  #preview { height: 170px; margin: 16px 0 4px; border: 1px solid var(--border-color); border-radius: 12px; }
  .stop { display: grid; grid-template-columns: 54px 1fr 74px auto; gap: 8px; align-items: center; margin-top: 8px; }
  .stop input[type="range"] { min-width: 0; }
  .stop input[type="number"] { padding: 9px 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .presets button { width: 54px; height: 34px; padding: 0; border: 1px solid var(--border-color); border-radius: 9px; }
  .presets button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<main class="app">
  <h1>Gradient Generator</h1>
  <p>Build linear, radial and conic CSS gradients with up to 6 color stops.</p>

  <div class="seg" id="types" role="group" aria-label="Gradient type">
    <button type="button" data-type="linear" aria-pressed="true">Linear</button>
    <button type="button" data-type="radial" aria-pressed="false">Radial</button>
    <button type="button" data-type="conic" aria-pressed="false">Conic</button>
  </div>

  <div id="preview" role="img" aria-label="Gradient preview"></div>

  <div id="angleBox">
    <label for="angle">Angle: <b id="angleVal">120</b>°</label>
    <input type="range" id="angle" min="0" max="360" value="120">
  </div>

  <h3>Color stops</h3>
  <div id="stops"></div>
  <div class="row">
    <button type="button" class="secondary" id="add">+ Add stop</button>
    <button type="button" class="secondary" id="random">🎲 Random</button>
    <button type="button" class="secondary" id="reverse">⇄ Reverse</button>
  </div>

  <h3>Presets</h3>
  <div class="presets" id="presets"></div>

  <label for="css">CSS</label>
  <textarea id="css" readonly style="min-height:70px" class="mono"></textarea>
  <div class="row"><button type="button" id="copy">Copy CSS</button></div>
</main>

<script src="../assets/js/common.js"></script>
<script>
(() => {
  const $ = DAW.$;
  const KEY = 'daw-gradient';
  const PRESETS = [
    ['#635bff', '#ff7eb3'], ['#00c6ff', '#0072ff'], ['#f7971e', '#ffd200'], ['#11998e', '#38ef7d'],
    ['#ee0979', '#ff6a00'], ['#141e30', '#243b55'], ['#a18cd1', '#fbc2eb'], ['#0f2027', '#2c5364']
  ];
  const state = Object.assign({
    type: 'linear', angle: 120,
    stops: [{ c: '#635bff', p: 0 }, { c: '#ff7eb3', p: 100 }]
  }, DAW.store.get(KEY, {}));
  if (!Array.isArray(state.stops) || state.stops.length < 2) state.stops = [{ c: '#635bff', p: 0 }, { c: '#ff7eb3', p: 100 }];

  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const rand = () => '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');

  function gradient() {
    const list = state.stops.map(s => `${s.c} ${s.p}%`).join(', ');
    if (state.type === 'radial') return `radial-gradient(circle at center, ${list})`;
    if (state.type === 'conic') return `conic-gradient(from ${state.angle}deg at center, ${list})`;
    return `linear-gradient(${state.angle}deg, ${list})`;
  }

  function paint() {
    const g = gradient();
    $('preview').style.background = g;
    $('css').value = `background: ${g};`;
    $('angleBox').hidden = state.type === 'radial';
    $('angle').value = state.angle;
    $('angleVal').textContent = state.angle;
    document.querySelectorAll('#types button').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.type === state.type ? 'true' : 'false'));
    $('add').disabled = state.stops.length >= 6;
    DAW.store.set(KEY, state);
  }

  function renderStops() {
    const box = $('stops');
    box.innerHTML = '';
    state.stops.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'stop';
      row.innerHTML =
        `<input type="color" aria-label="Color ${i + 1}" value="${s.c}">` +
        `<input type="range" aria-label="Position ${i + 1}" min="0" max="100" value="${s.p}">` +
        `<input type="number" aria-label="Position ${i + 1} percent" min="0" max="100" value="${s.p}">` +
        `<button type="button" class="danger small" aria-label="Remove stop ${i + 1}" ${state.stops.length <= 2 ? 'disabled' : ''}>✕</button>`;
      const [color, range, num, del] = row.children;
      color.addEventListener('input', () => { s.c = color.value; paint(); });
      const setPos = v => { s.p = clamp(Math.round(+v) || 0, 0, 100); range.value = num.value = s.p; paint(); };
      range.addEventListener('input', () => setPos(range.value));
      num.addEventListener('input', () => { if (num.value !== '') setPos(num.value); });
      del.addEventListener('click', () => { state.stops.splice(i, 1); renderStops(); paint(); });
      box.appendChild(row);
    });
  }

  $('types').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.type = b.dataset.type; paint();
  });
  $('angle').addEventListener('input', () => { state.angle = +$('angle').value; paint(); });
  $('add').addEventListener('click', () => {
    if (state.stops.length >= 6) return;
    state.stops.push({ c: rand(), p: 100 });
    // Spread the stops evenly.
    state.stops.forEach((s, i, a) => { s.p = Math.round(i * 100 / (a.length - 1)); });
    renderStops(); paint();
  });
  $('random').addEventListener('click', () => {
    state.stops.forEach(s => { s.c = rand(); });
    state.angle = Math.floor(Math.random() * 361);
    renderStops(); paint();
  });
  $('reverse').addEventListener('click', () => {
    state.stops = state.stops.map(s => ({ c: s.c, p: 100 - s.p })).reverse();
    renderStops(); paint();
  });
  $('copy').addEventListener('click', () => DAW.copy($('css').value, $('copy')));

  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.title = p.join(' → ');
    b.setAttribute('aria-label', 'Preset ' + p.join(' to '));
    b.style.background = `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
    b.addEventListener('click', () => {
      state.stops = [{ c: p[0], p: 0 }, { c: p[1], p: 100 }];
      renderStops(); paint();
    });
    $('presets').appendChild(b);
  });

  renderStops();
  paint();
})();
</script>
</body>
</html>
