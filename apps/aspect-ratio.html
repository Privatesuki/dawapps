<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>Aspect Ratio · DAWAPPS</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/global.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/i18n.js"></script>
<style>
  .frame { display: grid; place-items: center; height: 160px; margin-top: 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; }
  #shape { display: grid; place-items: center; color: var(--on-accent); font: 600 13px var(--mono); background: var(--accent); border-radius: 6px; max-width: 90%; max-height: 90%; }
</style>
</head>
<body>
<main class="app">
  <h1>Aspect Ratio Calculator</h1>
  <p>Simplify any resolution, then scale it without distortion.</p>

  <div class="grid2">
    <div><label for="w">Width (px)</label><input id="w" type="number" value="1920" min="1" step="1" inputmode="numeric"></div>
    <div><label for="h">Height (px)</label><input id="h" type="number" value="1080" min="1" step="1" inputmode="numeric"></div>
  </div>
  <div class="row tight" id="presets" style="margin-top:8px">
    <button type="button" class="secondary small" data-r="1920x1080">1080p</button>
    <button type="button" class="secondary small" data-r="1280x720">720p</button>
    <button type="button" class="secondary small" data-r="3840x2160">4K</button>
    <button type="button" class="secondary small" data-r="1080x1920">9:16</button>
    <button type="button" class="secondary small" data-r="1080x1080">1:1</button>
    <button type="button" class="secondary small" data-r="1024x768">4:3</button>
  </div>

  <div class="stats">
    <div class="stat"><span>Ratio</span><strong id="ratio">—</strong></div>
    <div class="stat"><span>Decimal</span><strong id="dec">—</strong></div>
    <div class="stat"><span>Megapixels</span><strong id="mp">—</strong></div>
  </div>
  <div class="frame"><div id="shape"></div></div>

  <hr>
  <h2>Resize proportionally</h2>
  <p class="small">Enter either side — the other follows the ratio above.</p>
  <div class="grid2">
    <div><label for="nw">New width</label><input id="nw" type="number" min="1" step="any" inputmode="decimal"></div>
    <div><label for="nh">New height</label><input id="nh" type="number" min="1" step="any" inputmode="decimal"></div>
  </div>
</main>

<script src="../assets/js/common.js"></script>
<script>
(() => {
  const $ = DAW.$;
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const num = id => parseFloat($(id).value);

  function calc() {
    const w = Math.round(num('w')), h = Math.round(num('h'));
    if (!(w > 0 && h > 0)) {
      ['ratio', 'dec', 'mp'].forEach(id => $(id).textContent = '—');
      $('shape').style.display = 'none';
      return;
    }
    const d = gcd(w, h);
    $('ratio').textContent = `${w / d}:${h / d}`;
    $('dec').textContent = (w / h).toFixed(3);
    $('mp').textContent = (w * h / 1e6).toFixed(2);

    const s = $('shape');
    s.style.display = 'grid';
    const box = 140, k = Math.min(box / w, box / h);
    s.style.width = Math.max(24, w * k * 1.4) + 'px';
    s.style.height = Math.max(24, h * k * 1.4) + 'px';
    s.textContent = `${w / d}:${h / d}`;
    resizeFrom('nw');
  }

  function resizeFrom(source) {
    const w = num('w'), h = num('h');
    if (!(w > 0 && h > 0)) return;
    const r = Math.round;
    if (source === 'nw') {
      const nw = num('nw');
      if (nw > 0) $('nh').value = r(nw * h / w * 100) / 100;
    } else {
      const nh = num('nh');
      if (nh > 0) $('nw').value = r(nh * w / h * 100) / 100;
    }
  }

  ['w', 'h'].forEach(id => $(id).addEventListener('input', calc));
  $('nw').addEventListener('input', () => { if (!$('nw').value) $('nh').value = ''; else resizeFrom('nw'); });
  $('nh').addEventListener('input', () => { if (!$('nh').value) $('nw').value = ''; else resizeFrom('nh'); });
  $('presets').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const [w, h] = b.dataset.r.split('x');
    $('w').value = w; $('h').value = h;
    calc();
  });
  $('nw').value = 1280;
  calc();
})();
</script>
</body>
</html>
