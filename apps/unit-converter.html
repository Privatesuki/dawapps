<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>Unit Converter · DAWAPPS</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/global.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/i18n.js"></script>
</head>
<body>
<main class="app">
  <h1>Unit Converter</h1>
  <p>Convert between common units instantly.</p>

  <label for="type">Category</label>
  <select id="type"></select>

  <label for="value">Value</label>
  <input id="value" type="number" value="1" step="any" inputmode="decimal">

  <div class="row" style="align-items:end">
    <div><label for="from">From</label><select id="from"></select></div>
    <button type="button" class="secondary" id="swap" aria-label="Swap units" style="flex:0 0 48px;min-width:48px">⇄</button>
    <div><label for="to">To</label><select id="to"></select></div>
  </div>

  <div class="output">
    <div class="big-number" id="result" style="text-align:left;font-size:34px">—</div>
    <div class="muted small" id="detail"></div>
  </div>
  <div class="row"><button type="button" class="secondary" id="copy">Copy result</button></div>
</main>

<script src="../assets/js/common.js"></script>
<script>
(() => {
  const $ = DAW.$;

  // factor = how many base units in 1 of this unit
  const DATA = {
    Length:      { base: 'm',   units: { m: 1, km: 1000, cm: .01, mm: .001, mi: 1609.344, yd: .9144, ft: .3048, in: .0254, 'nmi': 1852 } },
    Mass:        { base: 'kg',  units: { kg: 1, g: .001, mg: 1e-6, t: 1000, lb: .45359237, oz: .028349523125, st: 6.35029318 } },
    Temperature: { base: 'C',   units: { '°C': 'C', '°F': 'F', K: 'K' } },
    Volume:      { base: 'L',   units: { L: 1, mL: .001, 'm³': 1000, 'gal (US)': 3.785411784, 'qt (US)': .946352946, 'pt (US)': .473176473, 'cup (US)': .2365882365, 'fl oz (US)': .0295735295625, tbsp: .01478676478125, tsp: .00492892159375 } },
    Area:        { base: 'm²',  units: { 'm²': 1, 'km²': 1e6, 'cm²': 1e-4, ha: 1e4, acre: 4046.8564224, 'ft²': .09290304, 'in²': 6.4516e-4, 'mi²': 2589988.110336 } },
    Speed:       { base: 'm/s', units: { 'm/s': 1, 'km/h': 1 / 3.6, mph: .44704, kn: .514444444, 'ft/s': .3048 } },
    Time:        { base: 's',   units: { ms: .001, s: 1, min: 60, h: 3600, day: 86400, week: 604800, year: 31557600 } },
    Data:        { base: 'B',   units: { bit: .125, B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824, TiB: 1099511627776 } }
  };

  const DEFAULT_PAIR = { Length: ['km', 'mi'], Mass: ['kg', 'lb'], Temperature: ['°C', '°F'], Volume: ['L', 'gal (US)'], Area: ['m²', 'ft²'], Speed: ['km/h', 'mph'], Time: ['h', 'min'], Data: ['MB', 'MiB'] };

  const type = $('type'), from = $('from'), to = $('to');
  Object.keys(DATA).forEach(k => type.add(new Option(k, k)));

  function fillUnits() {
    const names = Object.keys(DATA[type.value].units);
    [from, to].forEach(sel => { sel.innerHTML = ''; names.forEach(n => sel.add(new Option(n, n))); });
    const [a, b] = DEFAULT_PAIR[type.value];
    from.value = a; to.value = b;
    convert();
  }

  function tempToC(v, u) { return u === 'C' ? v : u === 'F' ? (v - 32) * 5 / 9 : v - 273.15; }
  function tempFromC(c, u) { return u === 'C' ? c : u === 'F' ? c * 9 / 5 + 32 : c + 273.15; }

  function fmt(n) {
    if (!Number.isFinite(n)) return '—';
    if (n !== 0 && (Math.abs(n) >= 1e15 || Math.abs(n) < 1e-7)) return n.toExponential(6);
    return Number(n.toPrecision(10)).toLocaleString(undefined, { maximumFractionDigits: 12 });
  }

  function convert() {
    const d = DATA[type.value], v = parseFloat($('value').value);
    if (!Number.isFinite(v)) { $('result').textContent = '—'; $('detail').textContent = 'Enter a number to convert.'; return; }
    let r;
    if (type.value === 'Temperature') {
      r = tempFromC(tempToC(v, d.units[from.value]), d.units[to.value]);
    } else {
      r = v * d.units[from.value] / d.units[to.value];
    }
    $('result').textContent = fmt(r) + ' ' + to.value;
    $('detail').textContent = `${fmt(v)} ${from.value} = ${fmt(r)} ${to.value}`;
  }

  type.addEventListener('change', fillUnits);
  $('value').addEventListener('input', convert);
  from.addEventListener('change', convert);
  to.addEventListener('change', convert);
  $('swap').addEventListener('click', () => { const t = from.value; from.value = to.value; to.value = t; convert(); });
  $('copy').addEventListener('click', e => DAW.copy($('detail').textContent, e.currentTarget));
  fillUnits();
})();
</script>
</body>
</html>
